<div class="reading-progress-bar" [style.width.%]="scrollProgressWidth"></div>
<header class="navbar-header">
  <div class="container navbar-container">
    <a href="#home" class="brand-logo" (click)="scrollToSection('home', $event)">
      Lalith Kumar S
    </a>

    <!-- Mobile Menu Control -->
    <div class="nav-controls-mobile">
      <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
        <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
      </button>
    </div>

    <!-- Navigation Menu -->
    <nav class="nav-menu" [class.active]="isMenuOpen">
      <ul class="nav-list">
        <li>
          <a href="#home" [class.active]="activeSection === 'home'" (click)="scrollToSection('home', $event)">Home</a>
        </li>
        <li>
          <a href="#about" [class.active]="activeSection === 'about'" (click)="scrollToSection('about', $event)">About</a>
        </li>
        <li>
          <a href="#skills" [class.active]="activeSection === 'skills'" (click)="scrollToSection('skills', $event)">Skills</a>
        </li>
        <li>
          <a href="#experience" [class.active]="activeSection === 'experience'" (click)="scrollToSection('experience', $event)">Experience</a>
        </li>
        <li>
          <a href="#projects" [class.active]="activeSection === 'projects'" (click)="scrollToSection('projects', $event)">Projects</a>
        </li>
        <li>
          <a href="#contact" [class.active]="activeSection === 'contact'" (click)="scrollToSection('contact', $event)">Contact</a>
        </li>
      </ul>

      <div class="nav-actions">
        <!-- Resume Modal Trigger Link -->
        <button (click)="triggerResumeModal($event)" class="btn btn-secondary btn-sm" title="View / Download Resume">
          <i class="fa-solid fa-file-arrow-down"></i> Resume
        </button>

        <a href="#contact" class="btn btn-primary btn-sm" (click)="scrollToSection('contact', $event)">Contact Me</a>
      </div>
    </nav>
  </div>
</header>

<!-- Floating Back to Top Button -->
<button class="back-to-top-btn" [class.visible]="showBackToTop" (click)="scrollToTop()" aria-label="Back to Top" title="Back to Top">
  <i class="fa-solid fa-arrow-up"></i>
</button>
