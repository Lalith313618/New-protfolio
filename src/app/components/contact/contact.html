<section class="contact-section">
  <div class="container">
    <div class="section-header reveal-on-scroll">
      <span class="section-tag">Get In Touch</span>
      <h2>Contact Information</h2>
    </div>

    <div class="contact-grid">
      <!-- Contact Cards -->
      <div class="card-column reveal-on-scroll stagger-1">
        <div class="card info-card">
          <div class="card-icon"><i class="fa-solid fa-envelope"></i></div>
          <div>
            <span class="info-label">Email Address</span>
            <a href="mailto:snslalith@gmail.com" class="info-value">snslalith&#64;gmail.com</a>
          </div>
        </div>

        <div class="card info-card">
          <div class="card-icon"><i class="fa-solid fa-phone"></i></div>
          <div>
            <span class="info-label">Phone Number</span>
            <a href="tel:+916380929051" class="info-value">+91 6380929051</a>
          </div>
        </div>

        <div class="card info-card">
          <div class="card-icon"><i class="fa-solid fa-location-dot"></i></div>
          <div>
            <span class="info-label">Location</span>
            <strong class="info-value">Ramanathapuram, Tamil Nadu</strong>
          </div>
        </div>

        <div class="card info-card">
          <div class="card-icon"><i class="fa-brands fa-linkedin"></i></div>
          <div>
            <span class="info-label">LinkedIn</span>
            <a href="https://www.linkedin.com/in/lalith-kumar-9034a4292/" target="_blank" rel="noopener noreferrer" class="info-value">linkedin.com/in/lalith-kumar</a>
          </div>
        </div>

        <div class="card info-card">
          <div class="card-icon"><i class="fa-brands fa-github"></i></div>
          <div>
            <span class="info-label">GitHub</span>
            <a href="https://github.com/Lalith313618" target="_blank" rel="noopener noreferrer" class="info-value">github.com/Lalith313618</a>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="card form-card reveal-on-scroll stagger-2">
        <h3>Send a Message</h3>

        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div *ngIf="submitStatus" [class]="'alert alert-' + submitStatus.type">
            <i *ngIf="submitStatus.type === 'success'" class="fa-solid fa-circle-check"></i>
            <i *ngIf="submitStatus.type !== 'success'" class="fa-solid fa-triangle-exclamation"></i>
            {{ submitStatus.message }}
          </div>

          <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" [(ngModel)]="formData.name" placeholder="Your Name" required class="form-control">
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="Your Email" required class="form-control">
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" [(ngModel)]="formData.subject" placeholder="Subject" class="form-control">
          </div>

          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" [(ngModel)]="formData.message" rows="4" placeholder="Your Message..." required class="form-control"></textarea>
          </div>

          <button type="submit" [disabled]="isSubmitting" class="btn btn-primary submit-btn">
            <i *ngIf="!isSubmitting" class="fa-solid fa-paper-plane"></i>
            <i *ngIf="isSubmitting" class="fa-solid fa-circle-notch fa-spin"></i>
            {{ isSubmitting ? 'Sending Message...' : 'Send Message' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
